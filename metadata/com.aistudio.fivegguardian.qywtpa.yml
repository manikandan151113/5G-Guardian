Summary: Continuous 5G cellular network monitor and instant fallback alert
Description: |-
  5G Guardian is a lightweight, 100% offline, privacy-first Android utility
  that continuously monitors your active mobile cellular connection and alerts
  you when your network degrades or falls back from 5G to 4G LTE or older
  generations.

  Key Capabilities:
  * Continuous background network detection using native Android Telephony APIs
  * Smart screen-off power saving (automatically pauses alarms when screen is off)
  * Active phone call suppression and 30-second post-call cooldown period
  * Zero internet permission requested — 100% offline and zero data collection
  * Customizable continuous alarm sirens or gentle single notification tones
  * Native Android system sounds and SAF storage custom audio file picker
  * Built-in interactive test simulator to safely verify fallback alarms

